name: release

on:
  push:
    tags: ['v*']

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rcusstackwalker/m32r-injector-toolchain:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile all ROM targets
        run: make compile

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elf-release
          path: '**/*.elf'
          if-no-files-found: error

  release:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download ELF artifacts
        uses: actions/download-artifact@v4
        with:
          name: elf-release
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            $(find release-artifacts -name '*.elf')
