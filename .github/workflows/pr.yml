name: pr

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prek
        run: pip install prek==0.4.0
      - name: Run prek on all files
        run: prek run --all-files

  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rcusstackwalker/m32r-injector-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all ROM targets
        run: make compile
      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elf-pr-${{ github.event.pull_request.number }}
          path: '**/*.elf'
          if-no-files-found: error
