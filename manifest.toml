[[rom.patches]]
id          = "cvt_overboost_protection"
name        = "CVT Overboost Protection (table definitions)"
category    = "boost"
description = "Adds EcuFlash XML table definitions for the stock CVT overboost-protection maps (throttle limit steps, load-on/off thresholds vs RPM, wastegate-duty cooldown). Metadata-only patch — no code or binary bytes are modified; the stock ROM already implements the logic, this exposes the tables for tuning."
