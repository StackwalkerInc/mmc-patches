[[rom.patches]]
id          = "load_extender"
name        = "Extended Load Maps + Alternate Map Set"
category    = "engine"
description = """\
Replaces the stock fuel, spark and MIVEC target load axes with wider ones and \
adds a second complete map set, both stored in the top 128KB (0x60000-0x80000). \
Map bodies are seeded from the stock ROM at build time, so a freshly built \
image behaves exactly like stock until the alt set is tuned. Requires FastECU \
to flash: EcuFlash's mitsubootloader method only writes 0x8000-0x60000.\
"""

[[rom.patches]]
id          = "mode_selector"
name        = "Multi-Map Mode Selector"
category    = "multimap"
description = """\
Toggles between the main and alt map sets by depressing the clutch and \
switching the position lights on (rising edge). Mode resets to main on each \
ignition cycle; a TPS blip above threshold within the first ~40 update cycles \
also selects alt. Drives the stock mode index, which the ROM's own 8-way \
multimap machinery already consumes.\
"""

[[rom.patches]]
id          = "etacs_position_lights"
name        = "ETACS Position Lights Handler"
category    = "multimap"
description = "Decodes the ETACS CAN position-lights signal via the confirmed Z37A CAN RX dispatch-table hook, feeding the mode selector's position_lights input."

[[rom.patches]]
id          = "dash_mode_rpm_indication"
name        = "Tachometer Mode Indication"
category    = "dash"
description = "Parks the tachometer at a configurable per-mode RPM (2500 main / 5000 alt) for a short window after each mode change, on the engine-to-dash CAN frame."

[[rom.patches]]
id          = "top_region_guard"
name        = "Top-Region Integrity Guard"
category    = "infrastructure"
description = "Checks a magic word at 0x60000 before any user code runs. If the top 128KB was never written, hands control to the bootloader's integrity-fault path instead of running on erased map data."

[[rom.patches]]
id          = "rolling_spark_cut"
name        = "Rolling Spark Cut (Coil-Dwell Based)"
category    = "rev-limit"
description = "Per-cylinder rolling coil-dwell cut for launch/2-step, replacing the previous single-threshold coil-dwell-store patch."

[[rom.patches]]
id          = "knock_mil"
name        = "Knock MIL Indicator (Knock CEL)"
category    = "knock"
description = "Flashes the MIL in coded patterns indicating knock intensity, using the shared knock_mil_simple module."


