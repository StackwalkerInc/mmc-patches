# mmc-patches manifest
# Single source of truth for supported ROMs: SHA-256, output IDs, and build metadata.
# The build verifies the ROM against sha256 before patching.
# Users supply their own stock ROM; see README.md for acquisition instructions.

[[rom]]
id          = "z27ag_jdm_5mt_2006"
name        = "Colt Ralliart Version-R Z27AG JDM 5MT (2006–2008)"
stock_rom_id_hex   = "33520003"
patched_rom_id_hex = "3352a403"
filename    = "Z27AG_JDM_5MT_1860B104.bin"
sha256      = "47f9a77bae32cc3bc818f949c5a8037d66a6b0e22091f8a9bc051283b91a384c"
target_dir  = "m32r/33520003_z27ag_mt_2006"
output_bin  = "3352a403_patched.bin"
output_xml  = "3352a403.xml"
arch        = "m32r"
mcu         = "M32176F4"
flash_kb    = 768

[[rom.patches]]
id          = "load400"
name        = "400% Load"
category    = "engine"
description = "Removes the 200% master load clamp, enabling tuning above ~17 psi (stock firmware caps master load at 200%)."

[[rom.patches]]
id          = "map_base"
name        = "MAP + MAT Sensor Acquisition"
category    = "engine"
description = "Samples the MAP (manifold absolute pressure) and MAT (manifold air temperature) sensors at 800 Hz and averages the readings into RAM variables. The MAF-based load calculation is unchanged; values are available for OBD logging and other patches."

[[rom.patches]]
id          = "load_extender"
name        = "Extended Load Maps"
category    = "engine"
description = "Replaces stock fuel, spark, and MIVEC map load axes with a wider range (up to 320% load) to support tuning at higher boost. Uses the stock MAF-derived engine load, not the MAP sensor."

[[rom.patches]]
id          = "injectors_alt"
name        = "Alternate Injector Scaling"
category    = "engine"
description = "Alternate injector dead-time and flow scaling tables for larger injectors."

[[rom.patches]]
id          = "boost_alt"
name        = "Alternate Boost Maps"
category    = "boost"
description = "Alternate wastegate base-duty and boost target-load maps (high gear and low gear variants) selectable via the multi-map switch."

[[rom.patches]]
id          = "precision_boost"
name        = "Precision Boost (PWM via Purge Solenoid)"
category    = "boost"
description = "Routes wastegate duty through the purge control solenoid output for finer PWM resolution on this ROM variant."

[[rom.patches]]
id          = "nlts"
name        = "No-Lift-To-Shift (NLTS)"
category    = "boost"
description = "Sustains boost pressure during clutch-in upshifts by suppressing throttle-based boost decay, reducing turbo lag between gears."

[[rom.patches]]
id          = "revolution_limit"
name        = "Configurable Rev Limit"
category    = "rev-limit"
description = "Per-gear rev limits with a separate launch control cut, replacing the single stock limiter."

[[rom.patches]]
id          = "knock_mil"
name        = "Knock MIL Indicator"
category    = "knock"
description = "Flashes the MIL (check-engine light) in coded patterns indicating knock intensity, with configurable thresholds and flash timers."

[[rom.patches]]
id          = "mode_selector"
name        = "Multi-Map Mode Selector"
category    = "multimap"
description = "Toggles between two tuning profiles (main and alt boost maps, rev limits) by pressing the clutch while flicking a lighting switch (position or fog lights — exact CAN bit TBD). Mode change is confirmed by a CEL flash pattern and the tachometer needle parking at 2500 RPM (main) or 5000 RPM (alt) while the engine is off. Mode resets to main on every ignition cycle; a TPS blip above threshold within ~2 s of ignition-on also activates alt mode."

[[rom.patches]]
id          = "start_ceremony"
name        = "Start Ceremony"
category    = "qol"
description = "Sweeps the tachometer needle through an animation on engine start as a visual confirmation that the patched firmware is active. The same hook also parks the needle at 2500 RPM (main) or 5000 RPM (alt) after a mode switch to confirm the active profile."

[[rom.patches]]
id          = "gear_detector"
name        = "Gear Detection"
category    = "qol"
description = "Infers current gear from clutch switch, TPS, and RPM signals; used by rev-limit and NLTS patches for gear-aware behaviour."

[[rom.patches]]
id          = "obd"
name        = "Extended OBD PIDs"
category    = "obd"
description = "Adds custom OBD PIDs exposing internal tuning variables (boost, load, mode index) for real-time logging over K-Line MUT."

[[rom.patches]]
id          = "colt_mt_cvt_dash"
name        = "MT→CVT Dash Control"
category    = "dash"
description = "Drives the CVT-type instrument cluster gear indicator from a 5MT gearbox using synthesised shift signals."

[[rom.patches]]
id          = "asc_to_dash_rx"
name        = "ASC→Dash CAN Relay"
category    = "dash"
description = "Relays CAN messages from the ASC module to the dash CAN slot required by the MT→CVT dash control patch."

[[rom.patches]]
id          = "etacs_extension"
name        = "ETACS Handler Extension"
category    = "infrastructure"
description = "Hooks the ETACS CAN receive handler to extract body-control signals from the bus. Currently exposes a lighting switch state (byte 2, bit 4 of the ETACS message — exact signal TBD) used by the mode selector."

[[rom.patches]]
id          = "gpio_outputs"
name        = "GPIO Output Hook"
category    = "infrastructure"
description = "Inserts a hook into the stock GPIO output update routine, providing a call point for patches that drive external outputs."


